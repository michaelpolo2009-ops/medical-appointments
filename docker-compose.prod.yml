services:
  mongo:
    image: mongo:latest
    container_name: mongo_db
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - medical_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    image: michaelpolo/medical-backend:latest
    container_name: medical_backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://mongo:27017/medical_appointments
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - medical_network

  notifications:
    image: michaelpolo/medical-notifications:latest
    container_name: medical_notifications
    restart: always
    environment:
      - MONGO_URI=mongodb://mongo:27017/medical_appointments
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - medical_network

volumes:
  mongo_data:

networks:
  medical_network:
    driver: bridge
